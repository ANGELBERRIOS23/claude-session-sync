name: Build macOS app

# Every push and pull request builds the app and keeps the zip as a run artifact.
# Pushing a tag like v1.1.1 also publishes it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick the file name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            expected="v$(sed -n 's/^VERSION="\(.*\)"$/\1/p' install.sh)"
            if [ "$version" != "$expected" ]; then
              echo "::error::Tag $version does not match VERSION in install.sh ($expected)"
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "ZIP=ClaudeSessionSync-${version}-macOS.zip" >> "$GITHUB_ENV"

      - name: Build the app bundle
        run: APP_DIR="$PWD/dist" UNIVERSAL=1 ./install.sh

      - name: Check the binary
        run: lipo -info "dist/Claude Session Sync.app/Contents/MacOS/ClaudeSessionSync"

      - name: Zip
        run: ditto -c -k --keepParent "dist/Claude Session Sync.app" "dist/$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSessionSync-macOS
          path: dist/${{ env.ZIP }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
